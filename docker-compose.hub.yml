# Run the PREBUILT clean P00RIJA Portfolio image — zero config, zero build.
#
# Get the image either way:
#   docker load -i p00rija-portfolio-image-v<version>.tar.gz
#     … or, once published:
#   docker pull p00rija/portfolio:latest
#
# Then simply:
#   docker compose -f docker-compose.hub.yml up -d
#   → http://localhost:3000
#
# First boot with no environment set: the container generates its session
# secret and falls back to the documented default CMS login (admin123).
# A CMS-PASSWORD.txt notice is written into ./db — CHANGE THE DEFAULT.

services:
  portfolio:
    image: ${P00RIJA_IMAGE:-p00rija/portfolio:latest}
    container_name: p00rija-portfolio
    restart: unless-stopped
    environment:
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: "1"
      HIDE_NEXT_DEV_INDICATOR: "1"
      HOSTNAME: 0.0.0.0
      PORT: "3000"
      DATABASE_URL: file:/app/db/custom.db
      # Recommended: set a strong CMS login instead of the default:
      # ADMIN_PASSWORD: "change-me-to-something-strong"
    ports:
      - "${P00RIJA_BIND_HOST:-0.0.0.0}:${P00RIJA_PORT:-3000}:3000"
    volumes:
      - ./db:/app/db
      - ./logs:/app/logs
    init: true
    cpus: "${P00RIJA_CPUS:-0}"
    mem_limit: "${P00RIJA_MEMORY_LIMIT:-0}"
    pids_limit: 256
    stop_grace_period: 20s
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
