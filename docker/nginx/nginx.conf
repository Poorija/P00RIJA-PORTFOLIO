# ─────────────────────────────────────────────────────────────────────────────
# P00RIJA Portfolio — Nginx main config (runs inside the nginx container)
# This file is mounted read-only at /etc/nginx/nginx.conf
# ─────────────────────────────────────────────────────────────────────────────

worker_processes auto;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    # ── MIME / basics ────────────────────────────────────────────────────────
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # ── Logging ───────────────────────────────────────────────────────────────
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" rt=$request_time';
    access_log /var/log/nginx/access.log main;
    error_log  /var/log/nginx/error.log warn;

    # ── Performance ───────────────────────────────────────────────────────────
    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    server_tokens off;
    client_max_body_size 50m;

    # ── Gzip ──────────────────────────────────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/x-javascript
        application/json
        application/xml
        application/xml+rss
        font/woff
        font/woff2
        image/svg+xml;

    # ── Cloudflare real-IP recovery ───────────────────────────────────────────
    # When behind Cloudflare CDN, $remote_addr is a CF edge IP. These directives
    # recover the visitor's real IP from CF-Connecting-IP / X-Forwarded-For by
    # trusting only the CF IP ranges. Included from a separate file so it can be
    # regenerated when CF publishes new ranges.
    include /etc/nginx/conf.d/cloudflare.conf;

    # ── Server blocks ─────────────────────────────────────────────────────────
    # The HTTP→HTTPS redirect and the main HTTPS server are generated by
    # install.sh into default.conf, which is included here.
    include /etc/nginx/conf.d/default.conf;
}
